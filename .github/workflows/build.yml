name: Build MS-DOS Wolfenstein 3-D

on:
  push:
    branches: [master, main, djgpp]
    tags: ['v*']
  pull_request:
    branches: [master, main, djgpp]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: msdos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            # Date-based version (UTC), e.g. v20261028
            VERSION="v$(date -u +%Y%m%d)"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Using version: ${VERSION}"

      # One exe per kind of game data (see VERSION in msdos/Makefile)
      - name: Build wolf3d.exe / spear.exe (embedded CWSDPMI)
        run: |
          mkdir -p release
          make DOCKER=1 setup
          for v in wl6 wl6apo wl1 sod sdm; do
            case $v in sod|sdm) exe=spear.exe ;; *) exe=wolf3d.exe ;; esac
            make DOCKER=1 VERSION=$v msdos_embedded
            dir=release/$(echo $v | tr a-z A-Z)
            mkdir -p $dir
            cp $exe $dir/$(echo $exe | tr a-z A-Z)
            cp setup.exe $dir/SETUP.EXE
            cp ipxsetup.exe $dir/IPXSETUP.EXE
            # co-op: the other players' sprites (named for the data:
            # PLAYERS.WL6 / .WL1 / .SOD / .SDM) and the respawn sound
            case $v in wl6apo) ext=WL6 ;; *) ext=$(echo $v | tr a-z A-Z) ;; esac
            cp PLAYERS.WL6 $dir/PLAYERS.$ext
            cp RESPAWN.WAD $dir/RESPAWN.WAD
            cp FREEDOOM.TXT $dir/FREEDOOM.TXT
            ls -la $dir
          done

      - name: Create release zip
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cat > release/README.TXT << EOF
          Wolfenstein 3-D - MS-DOS / FreeDOS (DJGPP, 32-bit protected mode)

          The id Software source built with DJGPP. No game data is included:
          copy the data files of your copy of the game into the same
          directory as the matching exe, and run it from there.

          Pick the directory that matches your data:

            WL6\WOLF3D.EXE     Wolfenstein 3-D 1.4, GT / Activision / id
                               (the version sold on Steam and GOG)
            WL6APO\WOLF3D.EXE  Wolfenstein 3-D 1.4, Apogee registered
            WL1\WOLF3D.EXE     Wolfenstein 3-D 1.4, Apogee shareware
            SOD\SPEAR.EXE      Spear of Destiny
            SDM\SPEAR.EXE      Spear of Destiny demo

          Files to copy next to the exe (the extension is WL6, WL1, SOD or
          SDM, as your data has it; upper or lower case doesn't matter):

            AUDIOHED.*  AUDIOT.*  GAMEMAPS.*  MAPHEAD.*
            VGADICT.*   VGAGRAPH.*  VGAHEAD.*  VSWAP.*

          Steam: Wolfenstein 3D\base     GOG: the game's install directory
          (CONFIG.* and SAVEGAM?.* are made by the game; an existing CONFIG
          from the original DOS game works, its saved games do not.)

          If the exe doesn't match the data, it says so and which one to use.

          Each exe is self-contained (CWSDPMI is built in).
          Requires:  386+ with FPU (or EMU387.DXE from DJGPP next to it),
                     4 MB RAM, VGA. Plain DOS, FreeDOS, Windows 9x or DOSBox
                     (not the DOS box of Windows NT/2000/XP).
          Sound:     set BLASTER=A220 I5 D1 (or similar) for the Sound
                     Blaster; AdLib, PC speaker and Sound Source work too.
                     Gravis UltraSound: ULTRASND= as its install sets it
                     (music in software: wants a fast 486 or a Pentium);
                     nogus to ignore it.
          Options:   WOLF3D /? lists them. Settings can be changed without
                     the menus, e.g. -music off -sfx pc -digi off, and are
                     saved when you quit; -defaults ignores the CONFIG file.
                     nowait, nomouse, nojoys, noal, nosb as in the original.
          Widescreen: -widescreen, or Widescreen in SETUP's Display screen:
                     a 16:9 VESA mode with a wider 3D view (-vesa WxH to
                     pick the mode). The normal VGA mode without one.
          Automap:   Tab (map, map over the view, off); + and - zoom.
          Setup:     SETUP.EXE sets sound, keys, mouse, joystick and view
                     size (it writes the CONFIG file). IPXSETUP.EXE is the
                     co-op menu: players, episode, level, skill, friendly
                     fire. IPXSETUP -nodes 3 ... skips the menu.
          Co-op:     IPX, 2 to 4 players. Everyone runs, with an IPX driver
                     loaded (in DOSBox: ipx=true, then IPXNET STARTSERVER on
                     one machine and IPXNET CONNECT <address> on the others):
                       WOLF3D -nodes 2 [-episode 1] [-level 1] [-skill 2]
                     Player 1's episode/level/skill are used. Dead players
                     come back at the level start; keys are shared.
                     The other players are BJ (PLAYERS.* next to the exe;
                     without it, recolored SS guards). The respawn sound is
                     RESPAWN.WAD, Freedoom's teleport sound (FREEDOOM.TXT).
                     Friendly fire is on unless -nofriendlyfire.
                     Esc leaves the game. T: chat (Enter sends); while
                     typing, Alt+1..Alt+0 send the macros SETUP edits.
          Deathmatch: WOLF3D -deathmatch -name YOURNAME (or IPXSETUP's
                     network screen). The first one starts the game, the
                     others join and leave whenever they like (2 to 4).
                     Everyone has every weapon and both keys; no enemies;
                     the exit is shut. SCORE is your frags; Tab shows
                     everybody's. -host / -join: only start / only join.
                     -monsters: keep the map's enemies; they come back
                     1-2 minutes after they're killed.
                     -bots N: N bots join too (in SS uniforms; IPXSETUP:
                     Bots), and leave to make room for players.

          Version:   ${VERSION}
          Built from: ${GITHUB_REPOSITORY}@${GITHUB_SHA}
          EOF
          sed -i 's/$/\r/' release/README.TXT
          cd release
          zip -9 -r "../wolf3d-msdos-${VERSION}.zip" README.TXT WL6 WL6APO WL1 SOD SDM
          cd ..
          ls -la wolf3d-msdos-*.zip
          unzip -l wolf3d-msdos-*.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wolf3d-msdos-${{ steps.version.outputs.version }}
          path: msdos/wolf3d-msdos-*.zip
          if-no-files-found: error

      # Create / update a release for every successful build on master/main
      # (or when a v* tag is pushed)
      - name: Create GitHub Release
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          files: msdos/wolf3d-msdos-*.zip
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  linux:
    # the Linux (SDL2) build, added to the same release
    needs: build
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SDL2
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev

      - name: Determine version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="v$(date -u +%Y%m%d)"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Build wolf3d / spear for each kind of data
        run: |
          mkdir -p release
          for v in wl6 wl6apo wl1 sod sdm; do
            case $v in sod|sdm) exe=spear ;; *) exe=wolf3d ;; esac
            make VERSION=$v $exe setup
            dir=release/$(echo $v | tr a-z A-Z)
            mkdir -p $dir
            strip $exe setup ipxsetup
            cp $exe setup ipxsetup $dir/
            case $v in wl6apo) ext=WL6 ;; *) ext=$(echo $v | tr a-z A-Z) ;; esac
            cp ../msdos/PLAYERS.WL6 $dir/PLAYERS.$ext
            cp ../msdos/RESPAWN.WAD ../msdos/FREEDOOM.TXT $dir/
            rm -f $exe
          done

      - name: Create release archive
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cat > release/README.TXT << EOF
          Wolfenstein 3-D - Linux (SDL2)

          The id Software source, built for Linux with SDL2 (install it:
          Debian/Ubuntu: sudo apt install libsdl2-2.0-0). No game data is
          included: copy your game's data files into the directory that
          matches them, or run the program with -data <directory>.

            WL6/wolf3d     Wolfenstein 3-D 1.4, GT / Activision / id
                           (the version sold on Steam and GOG)
            WL6APO/wolf3d  Wolfenstein 3-D 1.4, Apogee registered
            WL1/wolf3d     Wolfenstein 3-D 1.4, Apogee shareware
            SOD/spear      Spear of Destiny
            SDM/spear      Spear of Destiny demo

          Files: AUDIOHED.* AUDIOT.* GAMEMAPS.* MAPHEAD.* VGADICT.*
          VGAGRAPH.* VGAHEAD.* VSWAP.* (upper or lower case).

          Options:   ./wolf3d --help. -fullscreen (or Alt+Enter),
                     -widescreen, -smooth, -nosound, -data DIR.
          Setup:     ./setup (in a terminal) sets sound, keys, mouse and
                     view size, as the DOS SETUP.EXE does; ./ipxsetup is
                     the network game menu (co-op / deathmatch, your
                     name, where to connect). Both take -data DIR.
          Co-op:     ./wolf3d -nodes 2 [-episode 1] [-level 1] [-skill 2]
          Deathmatch: ./wolf3d -deathmatch -name YOURNAME
                     The first one starts the game, the others join (and
                     leave) whenever they like. Everyone has every weapon
                     and both keys, no enemies, the exit is shut; SCORE is
                     your frags, Tab shows everybody's.
                     -bots N adds N bots (in SS uniforms).
          Network:   UDP port 27135 on the local network; -port N for
                     another, -connect host[:port] for a game elsewhere.
                     Or TCP through a server (for the internet):
                     ./wolf3d -tcpserver [port] on one, ./wolf3d -tcp
                     host[:port] on the others. P shows or hides the
                     ping times.
          With DOS:  DOS players in DOSBox use IPX through DOSBox's IPXNET:
                     ./wolf3d -ipxnet host:port joins an IPXNET server
                     (IPXNET STARTSERVER port in DOSBox), ./wolf3d
                     -ipxserver [port] is one (IPXNET CONNECT host port).

          Version:   ${VERSION}
          Built from: ${GITHUB_REPOSITORY}@${GITHUB_SHA}
          EOF
          tar -C release -czf "wolf3d-linux-x86_64-${VERSION}.tar.gz" README.TXT WL6 WL6APO WL1 SOD SDM
          tar -tzf wolf3d-linux-x86_64-*.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wolf3d-linux-${{ steps.version.outputs.version }}
          path: linux/wolf3d-linux-*.tar.gz
          if-no-files-found: error

      - name: Add to the GitHub Release
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          files: linux/wolf3d-linux-*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
